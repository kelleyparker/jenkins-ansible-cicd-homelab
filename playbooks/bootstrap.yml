---
- name: Prepare Ubuntu targets before the first deployment dry run
  hosts: nginx
  become: true
  gather_facts: true
  tasks:
    - name: Require Ubuntu 24.04
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: This lab targets Ubuntu 24.04.

    - name: Install NGINX
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the lab web root
      ansible.builtin.file:
        path: /var/www/cicd-lab
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Enable and start NGINX
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
